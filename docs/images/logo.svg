<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-label="AshiArt logo">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="180" rx="16" fill="url(#panel)"/>
  <rect x="0.75" y="0.75" width="638.5" height="178.5" rx="15.25" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <!-- Terminal glyph card -->
  <g>
    <rect x="28" y="28" width="124" height="124" rx="12" fill="#010409" stroke="#30363D" stroke-width="1.5"/>
    <circle cx="46" cy="46" r="4" fill="#FF5F56"/>
    <circle cx="60" cy="46" r="4" fill="#FEBC2E"/>
    <circle cx="74" cy="46" r="4" fill="#28C840"/>
    <text x="44" y="82" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="28" font-weight="700" fill="url(#accent)">A@</text>
    <text x="44" y="106" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B949E">#$%*+=</text>
    <text x="44" y="124" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#58A6FF">;:,.. </text>
  </g>
  <!-- Wordmark -->
  <g>
    <text x="176" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#F0F6FC">AshiArt</text>
    <text x="178" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8B949E">ASCII art generator for images</text>
    <rect x="178" y="128" width="72" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
