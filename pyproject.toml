[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "SIM", "BLE", "RUF", "B", "PLW", "PIE", "EXE"]

[tool.ruff.lint.per-file-ignores]
# io.py broad catches are the documented error contract: any decode or
# network failure surfaces as FileNotFoundError/ValueError.
"ashiart/io.py" = ["BLE001"]

[tool.mypy]
python_version = "3.9"
# cv2 is an optional dependency (ashiart[video]).
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py" 